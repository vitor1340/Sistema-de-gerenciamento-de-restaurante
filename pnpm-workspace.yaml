packages:
  - "apps/*"
  - "packages/*"
overrides:
  # deepmerge-ts < 8 tem CVE de DoS por stack overflow (GHSA-ggr8-5vv4-36mx).
  # Puxado transitivamente por prisma -> @prisma/config; não é usado em
  # runtime de request, só no carregamento de config do Prisma CLI.
  deepmerge-ts: ^8.0.2
  # mysql2 < 3.22 tem CVE de downgrade de auth plugin que vaza credencial em
  # texto plano (GHSA-3f6p-5ww8-9rcr). Puxado transitivamente pelo próprio
  # `prisma`/`@prisma/client` (suporte a múltiplos bancos) — este projeto só
  # usa PostgreSQL (@prisma/adapter-pg), mysql2 nunca é executado aqui.
  mysql2: ^3.24.2
allowBuilds:
  '@prisma/engines': true
  bcrypt: true
  esbuild: true
  prisma: true
  unrs-resolver: true
